parity_params:
  output_dir: results/parity
  cache_dir: .cache/parity

  speed:
    run: true
    output_dir: results/speed_parity
    warmup_repetitions: 1
    measured_repetitions: 7
    execution_order: counterbalanced
    random_seed: 20260727
    n_cpus: 1
    native_math_threads: 1
    calibration_mode: true
    aspirational_ratio_max: 1.25
    noise:
      max_robust_cv: 0.15
      retry_noisy_once: true
    default_params:
      run: true
    task_runs:
      srp254919_tximport:
        run: true
        provisional_ratio_max: 1.50
        benchmark_adata: true
        provisional_adata_overhead_max: 1.15
      pasilla:
        run: true
        provisional_ratio_max: 6.00
      pickrell:
        run: true
        provisional_ratio_max: 2.75

  expected_versions:
    python: "3.12.14"
    r: "4.5.3"
    deseq2: "1.50.2"
    pydeseq2: "0.5.5.dev25+g9b42a302f"
    pasilla: "1.38.0"
    tweedeseqcountdata: "1.48.0"

  default_params:
    n_cpus: 1
    fit_type: parametric
    size_factor_fit_type: ratio
    refit_cooks: true

  pytximport_input_mode_tolerance:
    rtol: 1.0e-12
    atol: 1.0e-12

  gate_profiles:
    common:
      factors:
        rtol: 1.0e-12
        atol: 1.0e-12
      normalized_counts:
        rtol: 1.0e-10
        atol: 1.0e-8
      base_mean:
        rtol: 1.0e-10
        atol: 1.0e-8

    tximport_strict:
      result_columns:
        log2FoldChange:
          pearson_min: 0.999999
          abs_diff_max: 0.001
          na_mask_disagreements_max: 0
        lfcSE:
          pearson_min: 0.9999
          abs_diff_max: 0.02
        stat:
          pearson_min: 0.9999
          abs_diff_max: 0.05
        pvalue:
          spearman_min: 0.9999
          abs_diff_max: 0.005
          na_mask_disagreements_max: 0
        padj:
          spearman_min: 0.9999
          abs_diff_max: 0.01
          na_mask_disagreements_max: 0
      sign_concordance_min: 1.0
      significant_sets_exact:
        - 0.05
        - 0.1

    raw_regression:
      result_columns:
        log2FoldChange:
          pearson_min: 0.9999
          spearman_min: 0.9999
          abs_diff_p95_max: 5.0e-4
          abs_diff_max: 0.025
          na_mask_disagreements_max: 0
        pvalue:
          pearson_min: 0.9997
          spearman_min: 0.9997
          abs_diff_p95_max: 0.02
          abs_diff_max: 0.20
          na_mask_disagreements_max: 1
        padj:
          pearson_min: 0.98
          spearman_min: 0.998
          abs_diff_p95_max: 0.10
          abs_diff_max: 0.25
          na_mask_disagreements_max: 0
      sign_concordance_min: 0.999
      significant_jaccard_min:
        "0.1": 0.97

  task_runs:
    geuvadis_salmon_tximport:
      run: true
      dataset: geuvadis
      mode: tximport
      input_source: salmon_quant
      design: "~ condition"
      sample_column: sample
      factor: condition
      factor_levels: [A, B]
      contrast_factor: condition
      contrast_numerator: B
      contrast_denominator: A
      alpha: 0.1
      expected_samples: 6
      expected_genes: 25343
      gate_profile: tximport_strict
      # Artificial grouping for software validation; not a biological contrast.
      sample_groups:
        ERR188297: A
        ERR188088: A
        ERR188329: A
        ERR188288: B
        ERR188021: B
        ERR188356: B
      importer_versions: {pytximport: "0.13.0", tximport: "1.38.2"}
      import_tolerance: {rtol: 1.0e-10, atol: 1.0e-8}
      source_commit: d299298a82daf36f96f0506a36fa802bfddef1ff
      downloads:
        ERR188297:
          filename: ERR188297.sf
          url: https://raw.githubusercontent.com/mikelove/tximportData/d299298a82daf36f96f0506a36fa802bfddef1ff/inst/extdata/salmon/ERR188297/quant.sf
          sha256: 668a028761de121c97a93c0e54c6cbd9d55abfd67b0887281bb97dbc73aedabe
        ERR188088:
          filename: ERR188088.sf
          url: https://raw.githubusercontent.com/mikelove/tximportData/d299298a82daf36f96f0506a36fa802bfddef1ff/inst/extdata/salmon/ERR188088/quant.sf
          sha256: 36975877b35b8d91440ddbd68b19ca21e704b322abde29edf635b96ec8e4477f
        ERR188329:
          filename: ERR188329.sf
          url: https://raw.githubusercontent.com/mikelove/tximportData/d299298a82daf36f96f0506a36fa802bfddef1ff/inst/extdata/salmon/ERR188329/quant.sf
          sha256: 0374b200c3c718f43a66a2612febba76b3cb5b172d2df75d1939701514c712ae
        ERR188288:
          filename: ERR188288.sf
          url: https://raw.githubusercontent.com/mikelove/tximportData/d299298a82daf36f96f0506a36fa802bfddef1ff/inst/extdata/salmon/ERR188288/quant.sf
          sha256: 04f7ebb674e1819fd722737878e03678c895863232a3d3094cb3214ff38be44d
        ERR188021:
          filename: ERR188021.sf
          url: https://raw.githubusercontent.com/mikelove/tximportData/d299298a82daf36f96f0506a36fa802bfddef1ff/inst/extdata/salmon/ERR188021/quant.sf
          sha256: 10d98a6aef22816a4849daa6b856e9f076ada8df3e6f11513b9b7ffd7e93b629
        ERR188356:
          filename: ERR188356.sf
          url: https://raw.githubusercontent.com/mikelove/tximportData/d299298a82daf36f96f0506a36fa802bfddef1ff/inst/extdata/salmon/ERR188356/quant.sf
          sha256: 4faabcaf62b6e0e5716040a1fbf9da09995160796d8c8324d4ba85fceb763a9f
        tx2gene:
          filename: tx2gene.csv
          url: https://raw.githubusercontent.com/mikelove/tximportData/d299298a82daf36f96f0506a36fa802bfddef1ff/inst/extdata/tx2gene.csv
          sha256: cdc79b8161de479ddaa6521304c42ced8d76bc6f3f9ba50d7a922f042ca4b107
    srp254919_tximport:
      run: true
      dataset: srp254919
      mode: tximport
      design: "~ treatment"
      sample_column: experiment_accession
      factor: treatment
      factor_levels:
        - mCherry
        - hND6
      contrast_factor: treatment
      contrast_numerator: hND6
      contrast_denominator: mCherry
      alpha: 0.1
      expected_genes: 1000
      expected_samples: 6
      gate_profile: tximport_strict
      downloads:
        counts:
          filename: SRP254919.salmon.merged.gene_counts.top1000cov.tsv
          url: https://raw.githubusercontent.com/nf-core/test-datasets/81ed58c830f2ef4640a5fd151968111dd8c5559d/data/genomics/mus_musculus/rnaseq_expression/SRP254919.salmon.merged.gene_counts.top1000cov.tsv
          sha256: f470f5cdfdf2830bb911ad518995fa7ede0969929f4db7766c2a063ca56d36e9
        samples:
          filename: SRP254919.samplesheet.csv
          url: https://raw.githubusercontent.com/nf-core/test-datasets/81ed58c830f2ef4640a5fd151968111dd8c5559d/data/genomics/mus_musculus/rnaseq_expression/SRP254919.samplesheet.csv
          sha256: 6d04fc05a0806e609017f75c174b1c8f7dde24368867357b4b31ccef7005f01a
        lengths:
          filename: SRP254919.spoofed_lengths.tsv
          url: https://raw.githubusercontent.com/nf-core/test-datasets/81ed58c830f2ef4640a5fd151968111dd8c5559d/data/genomics/mus_musculus/rnaseq_expression/SRP254919.spoofed_lengths.tsv
          sha256: d797a6ede76078b91033636e5c4947fc60f31b28ad0d29e808a015e0cd24cfdf
      input_hashes:
        counts: f470f5cdfdf2830bb911ad518995fa7ede0969929f4db7766c2a063ca56d36e9
        samples: 6d04fc05a0806e609017f75c174b1c8f7dde24368867357b4b31ccef7005f01a
        lengths: d797a6ede76078b91033636e5c4947fc60f31b28ad0d29e808a015e0cd24cfdf

    pasilla:
      run: true
      dataset: pasilla
      mode: matrix
      design: "~ 0 + condition"
      sample_column: sample
      factor: condition
      factor_levels:
        - untreated
        - treated
      contrast_factor: condition
      contrast_numerator: treated
      contrast_denominator: untreated
      alpha: 0.1
      expected_genes: 8148
      expected_samples: 7
      gate_profile: raw_regression
      input_hashes:
        counts: d7aaf3b8f7ebfefd8906cae171633648a9b4182184c007b23b17e0bc019f12d1
        samples: 8325315f34d4402551191f09d46e37789b5a41a20e86019c39a57dc065dd8fb2

    pickrell:
      run: true
      dataset: pickrell
      mode: matrix
      design: "~ 0 + gender"
      sample_column: sample
      factor: gender
      factor_levels:
        - female
        - male
      contrast_factor: gender
      contrast_numerator: male
      contrast_denominator: female
      alpha: 0.1
      expected_genes: 12531
      expected_samples: 69
      gate_profile: raw_regression
      gate_overrides:
        result_columns:
          padj:
            na_mask_disagreements_max: 1250
      known_gap:
        name: pickrell_independent_filtering_padj_mask
        result_column: padj
        description: >-
          PyDESeq2 and R DESeq2 can select different independent-filtering
          cutoffs for this dataset; all other Pickrell gates remain active.
      input_hashes:
        counts: 9173a85c72bb7cb5212b51e8746037ac0c35ab52008d46097159ee8fc76592bb
        samples: e770df47798c4a71e0bb3fa50e46af244d04311909ce03324ef2ec701927c670
